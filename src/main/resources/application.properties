spring.application.name=deuktemsiru

# ── DataSource (PostgreSQL) ──────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deuktemsiru}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:deuktemsiru}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:deuktemsiru}

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── 서버 ─────────────────────────────────────────────────────
server.port=8080

# ── 업로드 ───────────────────────────────────────────────────
app.upload.menu-image-dir=uploads/menu-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── JWT ──────────────────────────────────────────────────────
# 운영 환경에서는 환경변수(APP_JWT_SECRET)로 반드시 교체할 것
app.jwt.secret=${APP_JWT_SECRET:deuktemsiru-dev-secret-key-must-be-changed-in-production}
# Access Token 만료: 30분
app.jwt.access-token-expiration-seconds=1800
# Refresh Token 만료: 14일
app.jwt.refresh-token-expiration-seconds=1209600

# ── 카카오 ───────────────────────────────────────────────────
kakao.api.user-info-url=https://kapi.kakao.com/v2/user/me

# ── Actuator / Metrics ───────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}
