name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build executable JAR
        run: ./gradlew clean check bootJar --stacktrace

      - name: Locate executable JAR
        id: jar
        run: |
          jar="$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-report
          path: build/reports/tests/test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key "${{ steps.jar.outputs.path }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app.jar"

      # deploy.md "4. 수동 배포"의 서비스 교체·헬스체크 블록과 동일하다.
      - name: Replace service and health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'DEPLOY'
          set -e
          sudo systemctl stop deuktemsiru
          sudo install -o app -g app -m 0644 "$HOME/app.jar" /opt/deuktemsiru/app.jar
          sudo systemctl restart deuktemsiru
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then exit 0; fi
            sleep 5
          done
          sudo journalctl -u deuktemsiru -n 100 --no-pager
          exit 1
          DEPLOY

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
